name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: |
          npm ci
          pip install pillow

      - name: Organizar os arquivos do app
        run: |
          mkdir -p www/fonts
          for f in index.html style.css app.js; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done
          ls -la www
          cp node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2 www/fonts/manrope.woff2

      - name: Criar o projeto Android
        run: |
          rm -rf android
          npx cap add android

      - name: Ícone, assinatura e versão
        env:
          CHAVE_B64: ""
        run: |
          cat > preparar.py <<'FIM'
          """Ajusta o projeto Android gerado pelo Capacitor: ícone, tela de abertura,
          chave de assinatura fixa e número de versão. Roda no GitHub Actions.
          Autor: João Pedro Figueredo da Cunha"""
          import base64, glob, math, os, re
          from PIL import Image, ImageDraw

          RAIZ = os.getcwd()
          APP = os.path.join(RAIZ, "android", "app")
          RES = os.path.join(APP, "src", "main", "res")
          FUNDO = (14, 17, 22, 255); ROXO = (142, 124, 255, 255); VERDE = (94, 230, 168, 255); BRANCO = (255, 255, 255, 255)

          def marca(d, cx, cy, r, w, anel=ROXO, ponto=VERDE):
              d.arc([cx - r, cy - r, cx + r, cy + r], start=-60, end=230, fill=anel, width=w)
              a = math.radians(-60); px, py = cx + r * math.cos(a), cy + r * math.sin(a)
              d.ellipse([px - w * .75, py - w * .75, px + w * .75, py + w * .75], fill=ponto)
              s = r * .42
              d.line([(cx - s, cy + s * .05), (cx - s * .25, cy + s * .75), (cx + s, cy - s * .6)], fill=anel, width=int(w * .9), joint="curve")

          def icone(tam, fundo, escala, mono=False, circulo=False):
              S = tam * 4; im = Image.new("RGBA", (S, S), (0, 0, 0, 0)); d = ImageDraw.Draw(im)
              if fundo:
                  if circulo: d.ellipse([0, 0, S, S], fill=FUNDO)
                  else: d.rounded_rectangle([0, 0, S, S], radius=S * .24, fill=FUNDO)
              r = S * escala
              marca(d, S / 2, S / 2, r, int(r * (.24 if mono else .22)), *( (BRANCO, BRANCO) if mono else (ROXO, VERDE) ))
              return im.resize((tam, tam), Image.LANCZOS)

          for k, f in {"mdpi": 1, "hdpi": 1.5, "xhdpi": 2, "xxhdpi": 3, "xxxhdpi": 4}.items():
              os.makedirs(f"{RES}/mipmap-{k}", exist_ok=True); os.makedirs(f"{RES}/drawable-{k}", exist_ok=True)
              icone(int(48 * f), True, .27).save(f"{RES}/mipmap-{k}/ic_launcher.png")
              icone(int(48 * f), True, .27, circulo=True).save(f"{RES}/mipmap-{k}/ic_launcher_round.png")
              icone(int(108 * f), False, .19).save(f"{RES}/mipmap-{k}/ic_launcher_foreground.png")
              icone(int(24 * f), False, .36, mono=True).save(f"{RES}/drawable-{k}/ic_stat_sol.png")

          for p in glob.glob(f"{RES}/drawable*/splash.png"):
              w, h = Image.open(p).size; im = Image.new("RGBA", (w, h), FUNDO); d = ImageDraw.Draw(im)
              r = min(w, h) * .075; marca(d, w / 2, h / 2, r, int(r * .22)); im.save(p)

          cor = f"{RES}/values/ic_launcher_background.xml"
          if os.path.exists(cor):
              open(cor, "w").write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0E1116</color>\n</resources>\n')

          # chave de assinatura fixa: o APK novo instala por cima do antigo sem perder os dados
          open(os.path.join(APP, "meudia.keystore"), "wb").write(base64.b64decode(os.environ["CHAVE_B64"]))

          g = os.path.join(APP, "build.gradle"); s = open(g).read()
          if "signingConfigs.meudia" not in s:
              s = s.replace("    buildTypes {", """    signingConfigs {
                  meudia {
                      storeFile file('meudia.keystore')
                      storePassword 'meudia123'
                      keyAlias 'meudia'
                      keyPassword 'meudia123'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.meudia
                  }""", 1)
          s = re.sub(r"versionCode \d+", 'versionCode (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()', s)
          open(g, "w").write(s)
          print("Projeto Android preparado.")
          FIM
          python preparar.py
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MeuDia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MeuDia-apk
          path: MeuDia.apk

      - name: Publicar link para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Meu Dia (versão ${{ github.run_number }})
          files: MeuDia.apk
          make_latest: true
